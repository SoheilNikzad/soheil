<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>soheil.info / calendar</title>
<meta name="description" content="وضعیت زمانی هفت روز؛ بدون نمایش جزئیات رویدادها.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./calendar.css">
</head>
<body>
<main class="wrap">
  <div class="title">
    <span>برنامهٔ هفتگی</span>
    <a href="/">soheil.info / calendar</a>
  </div>

  <div class="days" id="days" aria-hidden="true"></div>

  <div class="stage">
    <div class="scale" id="scale" aria-hidden="true"></div>
    <div class="viewport" id="viewport" aria-label="تقویم هفتگی قابل پیمایش">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="legend" aria-label="راهنمای رنگ‌ها">
    <div class="legend-item"><div class="legend-box blue"></div><span class="legend-label">زمان پیشنهادی</span></div>
    <div class="legend-item"><div class="legend-box yellow"></div><span class="legend-label">قابل هماهنگی</span></div>
    <div class="legend-item"><div class="legend-box red"></div><span class="legend-label">مشغول</span></div>
    <div class="legend-item"><div class="legend-box navy"></div><span class="legend-label">خارج از دسترس</span></div>
  </div>

  <p class="note">برای دیدن ساعت‌های دیگر، بالا یا پایین برو.</p>
  <p id="status" class="status" role="status"></p>
</main>
<script src="./calendar.js" defer></script>
</body>
</html>
