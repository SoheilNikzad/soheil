<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>soheil.info / calendar</title>
  <meta name="description" content="زمان‌های آزاد برای هماهنگی.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200&family=Vazirmatn:wght@200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./calendar.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand latin" href="/" aria-label="soheil.info / calendar">soheil.info / calendar</a>
      <h1>برنامهٔ هفتگی</h1>
    </header>

    <section class="week-controls" aria-label="کنترل هفته">
      <button id="olderWeek" class="arrow-button latin" type="button" aria-label="هفتهٔ قبل">‹</button>
      <div class="week-center">
        <p id="weekRange" class="week-range" aria-live="polite">—</p>
        <button id="currentWeek" class="current-week" type="button">هفتهٔ جاری</button>
      </div>
      <button id="newerWeek" class="arrow-button latin" type="button" aria-label="هفتهٔ بعد">›</button>
    </section>

    <section class="calendar" aria-label="برنامهٔ هفتگی؛ هفت روز و بیست‌وچهار ساعت">
      <div class="matrix-shell" id="matrixShell">
        <div class="day-headings" id="dayHeadings" aria-hidden="true"></div>

        <div class="matrix-row">
          <div class="time-window" aria-hidden="true">
            <div class="time-track" id="timeTrack"></div>
          </div>

          <div
            class="matrix-viewport"
            id="matrixViewport"
            tabindex="0"
            role="group"
            aria-label="برای تغییر ساعت بالا یا پایین و برای تغییر هفته چپ یا راست بکشید"
          >
            <div class="hour-stack" id="hourStack"></div>
          </div>
        </div>

        <div class="matrix-meta">
          <span class="latin">Asia/Tehran</span>
          <span id="visibleHours" class="latin">08:00 — 15:00</span>
        </div>

        <div class="legend" aria-label="راهنمای وضعیت‌ها">
          <div class="legend-item legend-blue">
            <span>زمان پیشنهادی</span>
            <i class="legend-square state-blue" aria-hidden="true"></i>
          </div>
          <div class="legend-item legend-yellow">
            <span>قابل هماهنگی</span>
            <i class="legend-square state-yellow" aria-hidden="true"></i>
          </div>
          <div class="legend-item legend-red">
            <span>مشغول</span>
            <i class="legend-square state-red" aria-hidden="true"></i>
          </div>
          <div class="legend-item legend-navy">
            <span>خارج از دسترس</span>
            <i class="legend-square state-navy" aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <p class="instruction">برای دیدن ساعت‌های دیگر، بالا یا پایین بروید.</p>
      <p class="instruction">برای دیدن هفته‌های دیگر، چپ یا راست بروید.</p>
      <p id="dataStatus" class="data-status" role="status"></p>
    </section>
  </main>

  <script src="./calendar.js" defer></script>
</body>
</html>
