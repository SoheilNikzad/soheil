<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>soheil.info / calendar</title>
  <meta name="description" content="زمان‌های آزاد و مشغول سهیل؛ بدون نمایش جزئیات رویدادها.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./calendar.css">
</head>
<body>
  <main class="root">
    <header class="topbar">
      <a class="brand" href="/" aria-label="soheil.info">soheil.info <span>/ calendar</span></a>
      <button id="themeToggle" class="icon-button" type="button" aria-label="تغییر پوسته" title="تغییر پوسته">◐</button>
    </header>

    <section class="intro">
      <h1>تقویم من</h1>
      <p>برای هماهنگی، وضعیت زمان‌ها را ببین. جزئیات برنامه‌های من نمایش داده نمی‌شود.</p>
    </section>

    <section class="legend" aria-label="راهنمای وضعیت‌ها">
      <div><i class="swatch preferred"></i><span>ترجیحی</span></div>
      <div><i class="swatch available"></i><span>آزاد</span></div>
      <div><i class="swatch busy"></i><span>مشغول</span></div>
      <div><i class="swatch unavailable"></i><span>خارج از دسترس</span></div>
    </section>

    <section class="calendar-card" aria-label="تقویم هفتگی">
      <div class="calendar-head">
        <button id="prevWeek" class="nav-button" type="button" aria-label="هفته قبل">‹</button>
        <div>
          <strong id="weekTitle">—</strong>
          <small id="timezoneLabel">Asia/Tehran</small>
        </div>
        <button id="nextWeek" class="nav-button" type="button" aria-label="هفته بعد">›</button>
      </div>

      <div id="weekGrid" class="week-grid" aria-live="polite"></div>

      <div class="calendar-foot">
        <button id="todayButton" class="today-button" type="button">این هفته</button>
        <span id="updatedAt">در حال دریافت تقویم…</span>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="./calendar.js" defer></script>
</body>
</html>
