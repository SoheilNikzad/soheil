name: Update calendar availability

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# Scheduler resync: 2026-09-28
permissions:
  contents: write

concurrency:
  group: update-calendar-availability
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public busy.json from Google Calendar iCal
        shell: python
        env:
          ICAL_URL: https://calendar.google.com/calendar/ical/soheil.nikzad%40gmail.com/public/basic.ics
        run: |
          import json, os, re, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Tehran")
          with urllib.request.urlopen(os.environ["ICAL_URL"], timeout=30) as r:
              text = r.read().decode("utf-8", errors="replace")

          text = re.sub(r"\r?\n[ \t]", "", text)

          def parse_dt(line):
              head, value = line.split(":", 1)
              tzid = next((p[5:] for p in head.split(";")[1:] if p.startswith("TZID=")), None)
              all_day = "VALUE=DATE" in head or re.fullmatch(r"\d{8}", value)
              if all_day:
                  return datetime.strptime(value[:8], "%Y%m%d").replace(tzinfo=TZ), True
              if value.endswith("Z"):
                  d = datetime.strptime(value, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
              else:
                  d = datetime.strptime(value, "%Y%m%dT%H%M%S")
                  try:
                      d = d.replace(tzinfo=ZoneInfo(tzid) if tzid else TZ)
                  except Exception:
                      d = d.replace(tzinfo=TZ)
              return d.astimezone(TZ), False

          now = datetime.now(TZ)
          low, high = now - timedelta(days=14), now + timedelta(days=120)
          busy = []

          for block in re.findall(r"BEGIN:VEVENT\r?\n(.*?)\r?\nEND:VEVENT", text, re.S):
              lines = block.splitlines()
              if any(x.upper() in ("TRANSP:TRANSPARENT", "STATUS:CANCELLED") for x in lines):
                  continue
              s = next((x for x in lines if x.startswith("DTSTART")), None)
              e = next((x for x in lines if x.startswith("DTEND")), None)
              if not s:
                  continue
              try:
                  start, all_day = parse_dt(s)
                  end = parse_dt(e)[0] if e else start + (timedelta(days=1) if all_day else timedelta(hours=1))
              except Exception:
                  continue
              if end > low and start < high:
                  busy.append({"start": start.isoformat(timespec="seconds"),
                               "end": end.isoformat(timespec="seconds")})

          busy.sort(key=lambda x: (x["start"], x["end"]))
          Path("calendar").mkdir(exist_ok=True)
          Path("calendar/busy.json").write_text(
              json.dumps({"updated": now.isoformat(timespec="seconds"),
                          "timezone": "Asia/Tehran",
                          "busy": busy},
                         ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          print(f"Wrote {len(busy)} busy intervals")

      - name: Commit busy.json if changed
        shell: bash
        run: |
          git add calendar/busy.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update calendar availability"
          git push
